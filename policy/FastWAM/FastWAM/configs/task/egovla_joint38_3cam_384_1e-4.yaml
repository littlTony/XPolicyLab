# @package _global_
# FastWAM training recipe for the active EgoVLA benchmark (38 upper-body
# joints, 30 Hz, three camera streams).  dataset_dirs/stats/cache/output are
# supplied by launch_egovla_fastwam_8gpu.sh so the recipe remains relocatable.
defaults:
  - override /model: fastwam
  - _self_

batch_size: 8
num_workers: 8
lr_scheduler_type: cosine
learning_rate: 1.0e-4
num_epochs: 100000
max_steps: 80000
log_every: 10
save_every: 10000
eval_every: 10000
eval_num_inference_steps: 10
gradient_accumulation_steps: 1
mixed_precision: bf16
seed: 42
max_grad_norm: 1.0
weight_decay: 1.0e-2
resume: null
save_optimizer_state: true
# Equal task probability, then uniform frames within each task (with replacement).
# Set frame_uniform to reproduce historical runs. Changing mode needs a new run.
train_sampling: task_uniform

wandb:
  enabled: true
  workspace: null
  project: fast-wam
  name: egovla_joint38_bs64_s42_80k
  group: null
  mode: online

data:
  train:
    _target_: fastwam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
    dataset_dirs: []
    shape_meta:
      images:
        - key: cam_high
          raw_shape: [3, 384, 384]
          shape: [3, 240, 320]
        - key: cam_left_wrist
          raw_shape: [3, 384, 384]
          shape: [3, 240, 320]
        - key: cam_right_wrist
          raw_shape: [3, 384, 384]
          shape: [3, 240, 320]
      action:
        - key: default
          raw_shape: 38
          shape: 38
      state:
        - key: default
          raw_shape: 38
          shape: 38
    num_frames: 33
    global_sample_stride: 1
    action_video_freq_ratio: 4
    video_size: [384, 320]
    camera_key: null
    val_set_proportion: 0.01
    is_training_set: true
    pretrained_norm_stats: null
    skip_padding_as_possible: false
    concat_multi_camera: robotwin
    processor:
      _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
      shape_meta: ${data.train.shape_meta}
      num_obs_steps: ${data.train.num_frames}
      num_output_cameras: 3
      action_output_dim: 38
      proprio_output_dim: 38
      action_state_transforms: null
      use_stepwise_action_norm: false
      norm_default_mode: z-score
      norm_exception_mode: null
      action_state_merger:
        _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
      train_transforms:
        - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
        - _target_: torchvision.transforms.Resize
          size: [240, 320]
      val_transforms:
        - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
        - _target_: torchvision.transforms.Resize
          size: [240, 320]
    text_embedding_cache_dir: null
    context_len: 128

  val:
    _target_: fastwam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
    dataset_dirs: []
    shape_meta:
      images:
        - key: cam_high
          raw_shape: [3, 384, 384]
          shape: [3, 240, 320]
        - key: cam_left_wrist
          raw_shape: [3, 384, 384]
          shape: [3, 240, 320]
        - key: cam_right_wrist
          raw_shape: [3, 384, 384]
          shape: [3, 240, 320]
      action:
        - key: default
          raw_shape: 38
          shape: 38
      state:
        - key: default
          raw_shape: 38
          shape: 38
    num_frames: 33
    global_sample_stride: 1
    action_video_freq_ratio: 4
    video_size: [384, 320]
    camera_key: null
    val_set_proportion: 0.01
    is_training_set: false
    pretrained_norm_stats: null
    skip_padding_as_possible: false
    concat_multi_camera: robotwin
    processor:
      _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
      shape_meta: ${data.val.shape_meta}
      num_obs_steps: ${data.val.num_frames}
      num_output_cameras: 3
      action_output_dim: 38
      proprio_output_dim: 38
      action_state_transforms: null
      use_stepwise_action_norm: false
      norm_default_mode: z-score
      norm_exception_mode: null
      action_state_merger:
        _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
      train_transforms:
        - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
        - _target_: torchvision.transforms.Resize
          size: [240, 320]
      val_transforms:
        - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
        - _target_: torchvision.transforms.Resize
          size: [240, 320]
    text_embedding_cache_dir: null
    context_len: 128
